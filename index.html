<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon suivi : tâches et dépenses</title>
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon suivi">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mute:#5d6b82;--line:#d9e0ea;--accent:#1b4fd8;--ok:#1a7f5a;--bad:#c2392b;--accent-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1524;--card:#17213a;--ink:#e8edf7;--mute:#9aa8c2;--line:#2a3652;--accent:#6c93ff;--ok:#4cc38f;--bad:#ff7b6b;--accent-ink:#0e1524}}
:root[data-theme="dark"]{--bg:#0e1524;--card:#17213a;--ink:#e8edf7;--mute:#9aa8c2;--line:#2a3652;--accent:#6c93ff;--ok:#4cc38f;--bad:#ff7b6b;--accent-ink:#0e1524}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1rem;font-weight:600;color:var(--mute);margin:0 0 12px}
.hero{background:var(--ink);color:var(--bg);border-radius:18px;padding:20px}
.hero .lbl{font-size:.85rem;opacity:.8}
.hero .big{font-size:2.4rem;font-weight:800;line-height:1.15;margin:2px 0 12px;word-break:break-word}
.hero .big.neg{color:#ff9b8f}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}
.bar i{display:block;height:100%;background:#7fb0ff;border-radius:6px}
.bar i.over{background:#ff7b6b}
.hero .sub{display:flex;justify-content:space-between;font-size:.85rem;margin-top:8px;opacity:.9;gap:8px;flex-wrap:wrap}
.budget{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:.85rem}
.budget input{flex:1;min-width:0}
.tabs{display:flex;gap:6px;margin:18px 0 12px;background:var(--line);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);font:inherit;font-weight:600;padding:10px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink)}
input,select,button{font:inherit}
input,select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.hero input{background:rgba(255,255,255,.12);color:var(--bg);border-color:rgba(255,255,255,.25)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
form{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:14px}
form .full{grid-column:1/-1}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;min-height:44px;padding:10px 16px;font-weight:600;cursor:pointer}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item .m{display:block;font-size:.8rem;color:var(--mute)}
.item .m.late{color:var(--bad);font-weight:600}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.item input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--accent)}
.amt{font-weight:800;white-space:nowrap}
.del{border:0;background:transparent;color:var(--mute);cursor:pointer;min-width:44px;min-height:44px;font-size:1.2rem;border-radius:10px}
.del:hover{color:var(--bad)}
.cats{display:grid;gap:6px;margin:0 0 14px}
.cat{display:flex;justify-content:space-between;font-size:.9rem;border-bottom:1px solid var(--line);padding:4px 0}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
[hidden]{display:none!important}
.tabs{gap:2px;overflow-x:auto}
.tabs button{padding:10px 4px;font-size:.74rem;min-width:0}
.part .big{font-size:1.4rem;font-weight:800;display:block}
.part.bad{border-color:var(--bad)}
.part{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.part .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.part .top b{flex:1;min-width:0;overflow-wrap:anywhere}
.part .pb{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:4px 0}
.part .pb i{display:block;height:100%;background:var(--accent);border-radius:5px}
.part .pb i.over{background:var(--bad)}
.part .m{font-size:.8rem;color:var(--mute)}
.ptot{font-weight:600;margin:0 0 10px}
.ptot.bad{color:var(--bad)}
.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);width:100%;margin-top:10px}
.amt.in{color:var(--ok)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi span{display:block;font-size:.8rem;color:var(--mute)}
.kpi b{font-size:1.05rem;overflow-wrap:anywhere}
.kpi b.pos{color:var(--ok)}.kpi b.neg{color:var(--bad)}
h2{font-size:.95rem;margin:18px 0 8px}
.chart svg{width:100%;height:auto;display:block}
.chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.leg{display:flex;gap:16px;font-size:.8rem;color:var(--mute);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.rtot{font-weight:600;margin:0 0 10px}
textarea{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:.8rem;margin-bottom:8px}
.row{display:flex;gap:8px}.row .btn{flex:1}
.msg{font-size:.85rem;color:var(--mute);margin:8px 0 0}
</style>
</head>
<body>
<main>
<h1 id="mois"></h1>
<section class="hero" aria-label="Budget du mois">
  <div class="lbl">Il te reste ce mois-ci</div>
  <div class="big" id="reste">0 F CFA</div>
  <div class="bar"><i id="barre" style="width:0"></i></div>
  <div class="sub"><span id="dep">Dépensé : 0</span><span id="bud"></span></div>
  <label class="budget">Budget du mois <input id="budget" type="number" inputmode="numeric" min="0" placeholder="Ex. 150000"></label>
</section>

<div class="tabs" role="tablist">
  <button role="tab" id="tab-t" aria-selected="true">Tâches</button>
  <button role="tab" id="tab-d" aria-selected="false">Dépenses</button>
  <button role="tab" id="tab-r" aria-selected="false">Revenus</button>
  <button role="tab" id="tab-p" aria-selected="false">Parts</button>
  <button role="tab" id="tab-e" aria-selected="false">Épargne</button>
  <button role="tab" id="tab-b" aria-selected="false">Bilan</button>
</div>

<section id="p-t">
  <form id="ft">
    <input class="full" id="tt" required placeholder="Nouvelle tâche" aria-label="Nouvelle tâche">
    <input id="td" type="date" aria-label="Date limite">
    <input id="th" type="time" aria-label="Heure">
    <button class="btn full">Ajouter la tâche</button>
  </form>
  <ul class="list" id="lt"></ul>
</section>

<section id="p-d" hidden>
  <form id="fd">
    <input id="da" type="number" inputmode="numeric" min="1" required placeholder="Montant (F CFA)" aria-label="Montant">
    <select id="dc" aria-label="Catégorie"><option>Petites dépenses</option><option>Nourriture</option><option>Transport</option><option>Logement</option><option>Communication</option><option>Santé</option><option>Église et dons</option><option>Travail</option><option>Loisirs</option><option>Autre</option></select>
    <input class="full" id="dn" placeholder="Note (facultatif)" aria-label="Note">
    <input id="dd" type="date" aria-label="Date">
    <button class="btn">Ajouter la dépense</button>
  </form>
  <div class="cats" id="cats"></div>
  <ul class="list" id="ld"></ul>
</section>
<section id="p-r" hidden>
  <form id="fr">
    <input id="ra" type="number" inputmode="numeric" min="1" required placeholder="Montant (F CFA)" aria-label="Montant">
    <select id="rc" aria-label="Source"><option>Salaire</option><option>Freelance</option><option>Vente</option><option>Trading</option><option>Aide ou cadeau</option><option>Autre</option></select>
    <input class="full" id="rn" placeholder="Note (facultatif)" aria-label="Note">
    <input id="rd" type="date" aria-label="Date">
    <button class="btn">Ajouter le revenu</button>
  </form>
  <p class="rtot" id="rtot"></p>
  <ul class="list" id="lr"></ul>
</section>

<section id="p-p" hidden>
  <h2 style="margin-top:0">Montant à répartir</h2>
  <input id="pbase" type="number" inputmode="numeric" min="0" placeholder="Par défaut : revenus du mois" aria-label="Montant à répartir">
  <p class="part m" id="pnote" style="border:0;background:none;padding:6px 0"></p>
  <form id="fp">
    <input class="full" id="pn" placeholder="Nom de la part (ex. Loyer)" aria-label="Nom de la part">
    <input id="pp" type="number" inputmode="decimal" min="0" placeholder="Valeur" aria-label="Valeur"><select id="pu" aria-label="Unité"><option value="%">%</option><option value="F">F CFA</option></select>
    <select class="full" id="pc" aria-label="Catégorie liée"><option value="">Aucune (suivi libre)</option><option value="__epargne">Épargne (objectifs)</option><option>Petites dépenses</option><option>Nourriture</option><option>Transport</option><option>Logement</option><option>Communication</option><option>Santé</option><option>Église et dons</option><option>Travail</option><option>Loisirs</option><option>Autre</option></select>
    <button class="btn full">Ajouter la part</button>
  </form>
  <p class="ptot" id="ptot"></p>
  <div class="part" id="pq" style="margin-bottom:8px"></div>
  <ul class="list" id="lp"></ul>
  <button type="button" class="btn ghost" id="pfill">Pré-remplir un modèle à modifier</button>
</section>

<section id="p-e" hidden>
  <div class="part" id="epot" style="margin-bottom:8px"></div>
  <form id="fg">
    <input class="full" id="gn" placeholder="Pour quoi j’économise ? (ex. iPhone)" aria-label="Nom de l’objectif">
    <input id="gt" type="number" inputmode="numeric" min="1" placeholder="Prix à atteindre" aria-label="Prix à atteindre">
    <input id="gm" type="number" inputmode="numeric" min="1" placeholder="Dépôt par mois" aria-label="Dépôt par mois">
    <button class="btn full">Ajouter l’objectif</button>
  </form>
  <p class="ptot" id="etot"></p>
  <ul class="list" id="lg"></ul>
</section>

<section id="p-b" hidden>
  <div class="kpis" id="kpis"></div>
  <h2>Revenus et dépenses sur 6 mois</h2>
  <div class="chart" id="chart"></div>
  <div class="leg"><span><i style="background:var(--ok)"></i>Revenus</span><span><i style="background:var(--bad)"></i>Dépenses</span></div>
  <h2>Dépenses du mois par catégorie</h2>
  <div class="cats" id="bcats"></div>
  <h2>Sauvegarde</h2>
  <textarea id="bk" rows="4" aria-label="Données" placeholder="Exporter remplit ce champ. Pour importer, colle ici les données exportées : elles remplacent celles de l’appli."></textarea>
  <div class="row"><button type="button" class="btn" id="exp">Exporter</button><button type="button" class="btn" id="imp">Importer</button></div>
  <p class="msg" id="bkmsg" role="status"></p>
</section>
</main>
<script>
(function(){
var KEY="suivi-v1",S={tasks:[],expenses:[],budget:0};
try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&typeof p==="object")S=Object.assign(S,p)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var iso=function(d){var o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)};
var today=iso(new Date()),ym=today.slice(0,7);
var fmt=function(n){return new Intl.NumberFormat("fr-FR").format(Math.round(n))+" F CFA"};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
$("td").value=today;$("dd").value=today;
$("mois").textContent=new Date().toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
$("budget").value=S.budget||"";

function tab(t){["t","d","r","p","e","b"].forEach(function(k){$("p-"+k).hidden=k!==t;$("tab-"+k).setAttribute("aria-selected",k===t)});if(t==="b")bilan();if(t==="p")prts();if(t==="e")goals()}
["t","d","r","p","e","b"].forEach(function(k){$("tab-"+k).onclick=function(){tab(k)}});

$("budget").oninput=function(){S.budget=Math.max(0,+this.value||0);save();hero()};
$("ft").onsubmit=function(e){e.preventDefault();var v=$("tt").value.trim();if(!v)return;
S.tasks.push({id:uid(),t:v,due:$("td").value,time:$("th").value,done:false});$("tt").value="";$("th").value="";save();tasks()};
$("fd").onsubmit=function(e){e.preventDefault();var a=+$("da").value;if(!(a>0))return;
S.expenses.push({id:uid(),a:a,c:$("dc").value,n:$("dn").value.trim(),d:$("dd").value||today});
$("da").value="";$("dn").value="";save();exps();hero()};

function tasks(){
var l=S.tasks.slice().sort(function(a,b){return (a.done-b.done)||(((a.due||"9")+(a.time||""))>((b.due||"9")+(b.time||""))?1:-1)});
$("lt").innerHTML=l.length?l.map(function(x){
var late=!x.done&&x.due&&(x.due+" "+(x.time||"23:59"))<(today+" "+new Date().toTimeString().slice(0,5));
var m=x.due?(late?"En retard : ":"Pour le ")+new Date(x.due+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+(x.time?" à "+x.time.replace(":","h"):""):"Sans date";
return '<li class="item'+(x.done?" done":"")+'"><input type="checkbox" data-k="'+x.id+'" aria-label="Terminée"'+(x.done?" checked":"")+'><span class="t">'+esc(x.t)+'<span class="m'+(late?" late":"")+'">'+m+'</span></span><button class="del" data-x="'+x.id+'" aria-label="Supprimer la tâche">×</button></li>'}).join(""):'<li class="empty">Aucune tâche. Ajoute la première ci-dessus.</li>'}
$("lt").onclick=function(e){var k=e.target.dataset.k,x=e.target.dataset.x;
if(k){S.tasks.forEach(function(t){if(t.id===k)t.done=e.target.checked})}
else if(x){S.tasks=S.tasks.filter(function(t){return t.id!==x})}else return;save();tasks()};

function month(){return S.expenses.filter(function(x){return x.d.slice(0,7)===ym})}
function hero(){
var tot=month().reduce(function(s,x){return s+x.a},0),b=S.budget||0,reste=b-tot;
$("dep").textContent="Dépensé : "+fmt(tot);
$("bud").textContent=b?"Budget : "+fmt(b):"Fixe un budget ci-dessous";
var el=$("reste");el.textContent=b?fmt(reste):"—";el.className="big"+(b&&reste<0?" neg":"");
var pc=b?Math.min(100,tot/b*100):0,br=$("barre");br.style.width=pc+"%";br.className=b&&reste<0?"over":""}
function exps(){
var m=month().sort(function(a,b){return a.d<b.d?1:-1}),by={};
m.forEach(function(x){by[x.c]=(by[x.c]||0)+x.a});
$("cats").innerHTML=Object.keys(by).sort(function(a,b){return by[b]-by[a]}).map(function(c){return '<div class="cat"><span>'+esc(c)+'</span><b>'+fmt(by[c])+'</b></div>'}).join("");
$("ld").innerHTML=m.length?m.map(function(x){
return '<li class="item"><span class="t">'+esc(x.n||x.c)+'<span class="m">'+esc(x.c)+" · "+new Date(x.d+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+'</span></span><span class="amt">'+fmt(x.a)+'</span><button class="del" data-x="'+x.id+'" aria-label="Supprimer la dépense">×</button></li>'}).join(""):'<li class="empty">Aucune dépense ce mois-ci.</li>'}
$("ld").onclick=function(e){var x=e.target.dataset.x;if(!x)return;
S.expenses=S.expenses.filter(function(t){return t.id!==x});save();exps();hero()};

S.income=S.income||[];
$("rd").value=today;
$("fr").onsubmit=function(e){e.preventDefault();var a=+$("ra").value;if(!(a>0))return;
S.income.push({id:uid(),a:a,c:$("rc").value,n:$("rn").value.trim(),d:$("rd").value||today});
$("ra").value="";$("rn").value="";save();revs()};
function revs(){
var m=S.income.filter(function(x){return x.d.slice(0,7)===ym}).sort(function(a,b){return a.d<b.d?1:-1});
$("rtot").textContent="Total du mois : "+fmt(m.reduce(function(s,x){return s+x.a},0));
$("lr").innerHTML=m.length?m.map(function(x){
return '<li class="item"><span class="t">'+esc(x.n||x.c)+'<span class="m">'+esc(x.c)+" · "+new Date(x.d+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+'</span></span><span class="amt in">'+fmt(x.a)+'</span><button class="del" data-x="'+x.id+'" aria-label="Supprimer le revenu">×</button></li>'}).join(""):'<li class="empty">Aucun revenu ce mois-ci.</li>'}
$("lr").onclick=function(e){var x=e.target.dataset.x;if(!x)return;
S.income=S.income.filter(function(t){return t.id!==x});save();revs()};

function sum(arr,k){return arr.filter(function(x){return x.d.slice(0,7)===k}).reduce(function(s,x){return s+x.a},0)}
function kpi(l,v,c){return '<div class="kpi"><span>'+l+'</span><b class="'+c+'">'+v+'</b></div>'}
function bilan(){
var now=new Date(),ks=[],i,d;
for(i=5;i>=0;i--){d=new Date(now.getFullYear(),now.getMonth()-i,1);ks.push({k:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),l:d.toLocaleDateString("fr-FR",{month:"short"})})}
var data=ks.map(function(o){return{l:o.l,r:sum(S.income,o.k),e:sum(S.expenses,o.k)}});
var cur=data[5],solde=cur.r-cur.e,taux=cur.r?Math.round(solde/cur.r*100):null;
var done=S.tasks.filter(function(t){return t.done}).length;
$("kpis").innerHTML=kpi("Revenus du mois",fmt(cur.r),"")+kpi("Dépenses du mois",fmt(cur.e),"")+kpi("Solde du mois",fmt(solde),solde<0?"neg":"pos")+kpi("Part épargnée",taux===null?"—":taux+" %",taux!==null&&taux<0?"neg":"")+kpi("Tâches terminées",done+" sur "+S.tasks.length,"");
var mx=Math.max.apply(null,data.reduce(function(a,r){return a.concat([r.r,r.e])},[]));
if(!mx){$("chart").innerHTML='<div class="empty">Ajoute des revenus et des dépenses pour voir l’évolution.</div>'}
else{var s='<svg viewBox="0 0 360 170" role="img" aria-label="Revenus et dépenses par mois"><line x1="0" y1="140" x2="360" y2="140" style="stroke:var(--line)"/>';
data.forEach(function(r,j){var x=j*60+6,hr=r.r/mx*120,he=r.e/mx*120;
s+='<rect x="'+x+'" y="'+(140-hr)+'" width="22" height="'+hr+'" rx="3" style="fill:var(--ok)"><title>Revenus : '+fmt(r.r)+'</title></rect><rect x="'+(x+26)+'" y="'+(140-he)+'" width="22" height="'+he+'" rx="3" style="fill:var(--bad)"><title>Dépenses : '+fmt(r.e)+'</title></rect><text x="'+(x+24)+'" y="158" text-anchor="middle" font-size="11" style="fill:var(--mute)">'+r.l+'</text>'});
$("chart").innerHTML=s+'</svg>'}
var by={},m=month();m.forEach(function(x){by[x.c]=(by[x.c]||0)+x.a});
$("bcats").innerHTML=Object.keys(by).length?Object.keys(by).sort(function(a,b){return by[b]-by[a]}).map(function(c){return '<div class="cat"><span>'+esc(c)+'</span><b>'+fmt(by[c])+" ("+Math.round(by[c]/cur.e*100)+" %)</b></div>"}).join(""):'<div class="empty">Aucune dépense ce mois-ci.</div>'}

$("exp").onclick=function(){var t=$("bk");t.value=JSON.stringify(S);t.focus();t.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}$("bkmsg").textContent=ok?"Données copiées. Colle-les où tu veux les garder.":"Sélectionne le texte et copie-le."};
$("imp").onclick=function(){try{var d=JSON.parse($("bk").value);if(!d||!Array.isArray(d.tasks)||!Array.isArray(d.expenses))throw 0;
S={tasks:d.tasks,expenses:d.expenses,income:Array.isArray(d.income)?d.income:[],budget:+d.budget||0,parts:Array.isArray(d.parts)?d.parts:[],pbase:+d.pbase||0,goals:Array.isArray(d.goals)?d.goals:[]};save();$("budget").value=S.budget||"";tasks();exps();revs();hero();bilan();$("pbase").value=S.pbase||"";prts();goals();$("bkmsg").textContent="Données importées."}catch(e){$("bkmsg").textContent="Données non valides : colle exactement le texte exporté."}};
S.parts=S.parts||[];S.pbase=S.pbase||0;$("pbase").value=S.pbase||"";
$("pbase").oninput=function(){S.pbase=Math.max(0,+this.value||0);save();prts()};
$("fp").onsubmit=function(e){e.preventDefault();var n=$("pn").value.trim(),p=+$("pp").value;if(!n||!(p>0))return;
S.parts.push({id:uid(),n:n,p:p,u:$("pu").value,c:$("pc").value});$("pn").value="";$("pp").value="";save();prts()};
$("lp").onclick=function(e){var x=e.target.dataset.x;if(!x)return;S.parts=S.parts.filter(function(t){return t.id!==x});save();prts()};
$("pfill").onclick=function(){[["Logement",30,"Logement"],["Nourriture",20,"Nourriture"],["Transport",10,"Transport"],["Dons",10,"Église et dons"],["Épargne",20,"__epargne"]].forEach(function(a){S.parts.push({id:uid(),n:a[0],p:a[1],c:a[2]})});save();prts()};
function alloc(p,base){return p.u==="F"?p.p:base*p.p/100}
function depMonth(){return S.goals.reduce(function(s,g){return s+g.d.filter(function(x){return x.k===ym}).reduce(function(a,x){return a+x.a},0)},0)}
function prts(){
var rev=sum(S.income,ym),base=S.pbase>0?S.pbase:rev,by={},dep=depMonth(),tot=0;
month().forEach(function(x){by[x.c]=(by[x.c]||0)+x.a});
$("pnote").textContent=S.pbase>0?"Base saisie à la main.":"Base : revenus du mois, "+fmt(rev)+".";
$("pfill").hidden=S.parts.length>0;
$("lp").innerHTML=S.parts.length?S.parts.map(function(p){
var al=alloc(p,base),ep=p.c==="__epargne",tr=ep||p.c,sp=ep?dep:(p.c?(by[p.c]||0):0),over=tr&&sp>al,pc=tr&&al>0?Math.min(100,sp/al*100):0;tot+=al;
var info=ep?"Déposé dans tes objectifs : "+fmt(sp)+(over?" (trop de "+fmt(sp-al)+")":", reste "+fmt(al-sp)+" à déposer"):p.c?esc(p.c)+" : dépensé "+fmt(sp)+(over?" (dépassé de "+fmt(sp-al)+")":", reste "+fmt(al-sp)):"Prévu, sans suivi de dépenses.";
return '<li class="part"><div class="top"><b>'+esc(p.n)+' · '+(p.u==="F"?fmt(p.p):p.p+' %')+'</b><span class="amt">'+fmt(al)+'</span><button class="del" data-x="'+p.id+'" aria-label="Supprimer la part">×</button></div>'+(tr?'<div class="pb"><i class="'+(over?"over":"")+'" style="width:'+pc+'%"></i></div>':'')+'<span class="m">'+info+'</span></li>'}).join(""):'<li class="empty">Aucune part. Ajoute-en ci-dessus ou pré-remplis un modèle.</li>';
var reste=base-tot,q=by["Petites dépenses"]||0,n=new Date(),dl=new Date(n.getFullYear(),n.getMonth()+1,0).getDate()-n.getDate()+1,l=reste-q;
$("ptot").textContent="Total réparti : "+fmt(tot)+" sur "+fmt(base);
var pq=$("pq");pq.className="part"+(reste<0?" bad":"");
pq.innerHTML=reste<0?'<b>Tes parts dépassent la base de '+fmt(-reste)+'</b><span class="m">Réduis une part pour qu’il reste de quoi vivre au quotidien.</span>':'<b>Pour le quotidien (déodorant, petits achats…)</b><span class="big">'+fmt(reste)+'</span><div class="pb"><i class="'+(q>reste?"over":"")+'" style="width:'+(reste>0?Math.min(100,q/reste*100):0)+'%"></i></div><span class="m">Dépensé en « Petites dépenses » : '+fmt(q)+(l>=0?". Il te reste "+fmt(l)+", soit environ "+fmt(l/dl)+" par jour jusqu’à la fin du mois.":" (dépassé de "+fmt(-l)+").")+'</span>'}

S.goals=S.goals||[];
$("fg").onsubmit=function(e){e.preventDefault();var n=$("gn").value.trim(),t=+$("gt").value,m=+$("gm").value;if(!n||!(t>0)||!(m>0))return;
S.goals.push({id:uid(),n:n,t:t,m:m,s:0,d:[]});$("gn").value="";$("gt").value="";$("gm").value="";save();goals();prts()};
$("lg").onclick=function(e){var x=e.target.dataset.x,k=e.target.dataset.k;
if(x){S.goals=S.goals.filter(function(g){return g.id!==x})}
else if(k){S.goals.forEach(function(g){if(g.id===k){var a=Math.min(g.m,g.t-g.s);if(a>0){g.s+=a;g.d.push({k:ym,a:a})}}})}else return;save();goals();prts()};
function goals(){
var pot=0,found=false,base=S.pbase>0?S.pbase:sum(S.income,ym);
S.parts.forEach(function(p){if(p.c==="__epargne"){found=true;pot+=alloc(p,base)}});
var dep=depMonth(),saved=S.goals.reduce(function(s,g){return s+g.s},0);
$("epot").innerHTML=found?'<b>Pot épargne du mois : '+fmt(pot)+'</b><span class="m">Déposé : '+fmt(dep)+' · reste à déposer : '+fmt(pot-dep)+'. Les dépôts sortent de ce pot, pas de ton solde.</span>':'<span class="m">Ajoute une part « Épargne (objectifs) » dans l’onglet Parts pour alimenter tes objectifs.</span>';
$("etot").textContent="Total épargné : "+fmt(saved);
$("lg").innerHTML=S.goals.length?S.goals.map(function(g){
var r=g.t-g.s,pc=Math.min(100,g.s/g.t*100),n=Math.ceil(r/g.m),d=new Date();d.setMonth(d.getMonth()+n,1);
var eta=r<=0?"Objectif atteint":"Il reste "+fmt(r)+" · environ "+n+" mois (vers "+d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})+")";
return '<li class="part"><div class="top"><b>'+esc(g.n)+'</b><span class="amt">'+fmt(g.s)+' / '+fmt(g.t)+'</span><button class="del" data-x="'+g.id+'" aria-label="Supprimer l’objectif">×</button></div><div class="pb"><i style="width:'+pc+'%"></i></div><span class="m">'+eta+' · mensualité '+fmt(g.m)+'</span>'+(r>0?'<button class="btn ghost" data-k="'+g.id+'">Déposer '+fmt(Math.min(g.m,r))+'</button>':'')+'</li>'}).join(""):'<li class="empty">Aucun objectif. Ajoute le premier ci-dessus.</li>'}

tasks();exps();revs();hero();prts();goals();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}</script>
